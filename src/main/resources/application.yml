spring:
  application:
    name: travel-planner-backend
  
  # Database Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/travel_db
    username: travel_user
    password: travel_password
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
    show-sql: false
    open-in-view: false

  # Security Configuration
  security:
    jwt:
      secret: your-secret-key-change-this-in-production-with-a-very-long-random-string-at-least-256-bits
      expiration: 86400000  # 24 hours in milliseconds

  # CORS Configuration
  web:
    cors:
      allowed-origins: "http://localhost:3000,http://localhost:5173"
      allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
      allowed-headers: "*"
      allow-credentials: true

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /

# Logging Configuration
logging:
  level:
    root: INFO
    com.travelplanner: DEBUG
    org.springframework.web: INFO
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# API Configuration
api:
  flight:
    amadeus:
      base-url: https://test.api.amadeus.com
      api-key: ${AMADEUS_API_KEY:}
      api-secret: ${AMADEUS_API_SECRET:}
  train:
    base-url: https://api.example.com
    api-key: ${TRAIN_API_KEY:}

# Cache Configuration
cache:
  flight:
    ttl-hours: 24
  train:
    ttl-hours: 24

# Swagger/OpenAPI Configuration
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
  show-actuator: true
